<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Victoria Clarke and the Galton Conspiracy — Issue 1</title><style>
html,body{margin:0;height:100%;background:#14110E;color:#EFE9E0;font:14px system-ui,sans-serif;overflow:hidden;user-select:none}
#stage{position:absolute;inset:0 0 44px 0;display:flex;align-items:center;justify-content:center}
#book{position:relative;transition:transform .22s ease}
#book img,#flip img{position:absolute;top:0;display:block;max-width:none;max-height:none}
#book .slot{position:absolute;top:0;height:100%;width:50%;overflow:hidden}
#book .slot.l{left:0}#book .slot.r{left:50%}
#book .slot.has{box-shadow:0 10px 40px rgba(0,0,0,.7)}
/* The turn: a static cover for the page that stays, a leaf that turns. */
/* The pages are flat and the overlay alone is in 3D, with its own perspective: in one shared 3D context Safari paints the page beneath over the cover (both at depth 0), Chrome does not. As a later sibling the overlay always paints above. */
#flip{position:absolute;inset:0;z-index:2;pointer-events:none;perspective:3000px;perspective-origin:50% 50%}
#flip .cover,#flip .leaf,#flip .half,#flip .face{position:absolute;top:0;height:100%}
#flip .cover{overflow:hidden}#flip .cover.bare{background:#14110E}
#flip .face{width:100%;left:0;overflow:hidden;backface-visibility:hidden;background:#f3eee5}
#flip .face.back{transform:rotateY(180deg)}
#flip .leaf{transform-style:preserve-3d;will-change:transform}
#flip .half{transform-style:preserve-3d}
#flip .shade{position:absolute;inset:0;pointer-events:none;opacity:0}
#flip .cover .shade{background:linear-gradient(to left,rgba(0,0,0,.55),rgba(0,0,0,0) 55%)}
#flip .cover.r .shade{background:linear-gradient(to right,rgba(0,0,0,.55),rgba(0,0,0,0) 55%)}
#flip .leaf .shade{background:linear-gradient(to right,rgba(0,0,0,.35),rgba(0,0,0,0) 40%,rgba(0,0,0,0) 70%,rgba(0,0,0,.25))}
.tap{position:absolute;top:0;bottom:44px;width:34%;cursor:pointer}.tap.l{left:0}.tap.r{right:0}
footer{position:absolute;left:0;right:0;bottom:0;height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 14px;color:#A99E90;font-size:13px;background:#1C1814;border-top:2px solid #322B22}
footer .who{display:flex;gap:14px;align-items:baseline}footer b{color:#EFE9E0}footer .proof{color:#f7b54a}
footer .nav{display:flex;align-items:center;gap:14px;justify-self:center;font-variant-numeric:tabular-nums}
.turn{width:38px;height:30px;border:1px solid #322B22;border-radius:0;background:#241F19;color:#EFE9E0;cursor:pointer;display:grid;place-items:center;padding:0}
.turn:hover{background:#F07020;color:#14110E;border-color:#F07020}.turn:disabled{opacity:.3;cursor:default}.turn svg{width:20px;height:20px}
@media (prefers-reduced-motion:reduce){#flip{display:none}}
</style></head><body>
<div id="stage"><div id="book"><div class="slot l"></div><div class="slot r"></div><div id="flip" hidden></div></div></div>
<div class="tap l" title="Previous"></div><div class="tap r" title="Next"></div>
<footer><span class="who"><b>Victoria Clarke and the Galton Conspiracy</b><span>Issue 1</span><span id="label"></span></span><span class="nav"><button class="turn" id="prev" aria-label="Previous page" title="Previous (←)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><span id="count"></span><button class="turn" id="next" aria-label="Next page" title="Next (→)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button></span><span></span></footer>
<script>
const P=[{"src":"pages/01.4d734e5e.webp","label":"Front cover","pages":1,"kind":"cover"},{"src":"pages/02.a8115d75.webp","label":"Pages IFC–1","pages":2,"kind":"standard"},{"src":"pages/03.149a086e.webp","label":"Pages 2–3","pages":2,"kind":"standard"},{"src":"pages/04.d39a6938.webp","label":"Pages 4–5","pages":2,"kind":"standard"},{"src":"pages/05.09cea45b.webp","label":"Pages 6–7","pages":2,"kind":"standard"},{"src":"pages/06.f907efe1.webp","label":"Pages 8–9","pages":2,"kind":"standard"},{"src":"pages/07.1696672a.webp","label":"Pages 10–11","pages":2,"kind":"standard"},{"src":"pages/08.9b939bf2.webp","label":"Pages 12–13","pages":2,"kind":"standard"},{"src":"pages/09.45856f9b.webp","label":"Pages 14–15","pages":2,"kind":"standard"},{"src":"pages/10.8300f4b2.webp","label":"Pages 16–17","pages":2,"kind":"standard"},{"src":"pages/11.7c8db1f5.webp","label":"Pages 18–19","pages":2,"kind":"standard"},{"src":"pages/12.3d0c1b32.webp","label":"Pages 20–IBC","pages":2,"kind":"standard"},{"src":"pages/13.60e34778.webp","label":"Back cover","pages":1,"kind":"back"}];const ASPECT=0.65031;
let i=Math.max(0,Math.min(P.length-1,parseInt(location.hash.slice(1))-1||0));
const TURN=new URLSearchParams(location.search).get('turn')==='cut'||matchMedia('(prefers-reduced-motion: reduce)').matches?'cut':'roll';
const book=document.getElementById('book'),flip=document.getElementById('flip'),label=document.getElementById('label'),count=document.getElementById('count'),prev=document.getElementById('prev'),next=document.getElementById('next');
const cache={};const load=(k)=>{if(k<0||k>=P.length||cache[k])return;const im=new Image();im.src=P[k].src;cache[k]=im};
let turning=false,shown=false,pw=0,ph=0;
const div=(c)=>{const d=document.createElement('div');d.className=c;return d};
// Which half of the book a view fills: a spread both, the cover the right, the back cover the left.
function slots(k){const p=P[k];if(p.pages>1)return{l:{src:p.src,x0:0,x1:.5,two:true},r:{src:p.src,x0:.5,x1:1,two:true}};
  const one={src:p.src,x0:0,x1:1,two:false};const onLeft=p.kind==='back'||(k===P.length-1&&k>0);return onLeft?{l:one,r:null}:{l:null,r:one}}
// A picture showing the slice [x0,x1] of its source, the source drawn at the book's scale.
function pic(s,dx){const im=new Image();im.src=s.src;const Ws=s.two?2*pw:pw;im.style.width=Ws+'px';im.style.height=ph+'px';im.style.left=(-s.x0*Ws+(dx||0))+'px';return im}
// A lone cover sits centred, as a closed book does; the slide to the spine happens before a turn and back after it (2026-10-01).
function centre(k){const s=slots(k);book.style.transform=s.l&&s.r?'':s.r?'translateX('+(-pw/2)+'px)':'translateX('+(pw/2)+'px)'}
function paint(k){const s=slots(k);for(const side of ['l','r']){const slot=book.querySelector('.slot.'+side);slot.innerHTML='';const v=s[side];slot.classList.toggle('has',!!v);if(v)slot.append(pic(v))}}
// Whole, even pixels for a page: the leaf's two halves and the two slots meet at pixel edges, so no hairline shows between them (2026-09-30).
function layout(){const w=innerWidth-24,h=innerHeight-68;pw=Math.floor(Math.min(h,(w/2)/ASPECT)*ASPECT);pw-=pw%2;ph=pw/ASPECT;book.style.width=(2*pw)+'px';book.style.height=ph+'px';if(shown&&!turning){paint(i);centre(i)}}
function settle(){label.textContent=P[i].label;count.textContent=(i+1)+' / '+P.length;prev.disabled=i===0;next.disabled=i===P.length-1;history.replaceState(null,'','#'+(i+1));load(i+1);load(i+2);load(i-1)}
const DUR=800;
// Half of a slot's slice: the inner half (lo) or the outer.
const sub=(s,lo)=>{if(!s)return null;const mid=(s.x0+s.x1)/2;return{...s,x0:lo?s.x0:mid,x1:lo?mid:s.x1}};
function face(s,back,dx){const d=div('face'+(back?' back':''));if(s)d.append(pic(s,dx));return d}
// A half of the leaf: its left and width in leaf space, and how far each face's picture shifts to stay put when the half is widened.
function half(left,w,front,back,fdx,bdx){const h=div('half');h.style.left=left+'px';h.style.width=w+'px';h.append(face(front,false,fdx),face(back,true,bdx));return h}
function turn(from,to,fwd,done){
  const A=slots(from),B=slots(to),q=pw/2;
  flip.hidden=false;flip.innerHTML='';
  // What stays put while the leaf turns: the far page of the old view.
  const cover=div('cover'+(fwd?' l':' r'));cover.style.left=(fwd?0:pw)+'px';cover.style.width=pw+'px';
  // An empty half stays empty until the leaf lands on it: the cover hides what is beneath either way.
  const stay=fwd?A.l:A.r;if(stay)cover.append(pic(stay));else cover.classList.add('bare');const cs=div('shade');cover.append(cs);
  const covered=book.querySelector('.slot.'+(fwd?'l':'r'));
  // The leaf: hinged at the spine, its outer half hinged at the leaf's own middle, so the free edge leads.
  const leaf=div('leaf');leaf.style.left=(fwd?pw:0)+'px';leaf.style.width=pw+'px';leaf.style.transformOrigin=fwd?'left center':'right center';
  const front=fwd?A.r:A.l,back=fwd?B.l:B.r;
  // The inner half runs one pixel under the outer's hinge, showing the same column of the picture, so the seam where the outer half bends never opens to the ground beneath. The back face is mirrored about the half's own middle, so widening it moves its picture: shifted back by the same pixel.
  const inner=fwd?half(0,q+1,sub(front,true),sub(back,false),0,1):half(q-1,q+1,sub(front,false),sub(back,true),1,0);
  const outer=half(fwd?q:0,q,sub(front,!fwd),sub(back,fwd),0,0);
  outer.style.transformOrigin=fwd?'left center':'right center';
  const ls=div('shade');leaf.append(inner,outer,ls);flip.append(cover,leaf);
  const ease='cubic-bezier(.42,.05,.28,1)',sign=fwd?-1:1;
  // The overlay now covers the old view exactly (cover + leaf at rest). Only
  // once it has painted does the book beneath become the next view, and only
  // then does the leaf move — so nothing shows through.
  flip.getBoundingClientRect();
  let started=false;const start=()=>{if(started)return;started=true;paint(to);if(!stay)covered.classList.remove('has');
  leaf.animate([{transform:'rotateY(0deg)'},{transform:'rotateY('+(sign*180)+'deg)'}],{duration:DUR,easing:ease,fill:'forwards'});
  outer.animate([{transform:'rotateY(0deg)'},{transform:'rotateY('+(sign*34)+'deg)',offset:.35},{transform:'rotateY('+(sign*12)+'deg)',offset:.75},{transform:'rotateY(0deg)'}],{duration:DUR,easing:'ease-in-out',fill:'forwards'});
  ls.animate([{opacity:0},{opacity:.9,offset:.45},{opacity:0}],{duration:DUR,fill:'forwards'});
  cs.animate([{opacity:0},{opacity:.15,offset:.5},{opacity:.7,offset:.92},{opacity:0}],{duration:DUR,fill:'forwards'});
  let finished=false;const fin=()=>{if(finished)return;finished=true;if(!stay&&(fwd?B.l:B.r))covered.classList.add('has');flip.hidden=true;flip.innerHTML='';centre(to);done()};
  leaf.getAnimations()[0].onfinish=fin;setTimeout(fin,DUR+160)};
  // Two frames for the overlay to paint; a timer in case frames are not
  // being delivered (a background tab), so a turn can never stay stuck.
  requestAnimationFrame(()=>requestAnimationFrame(start));setTimeout(start,90)
}
function show(k,dir){const n=Math.max(0,Math.min(P.length-1,k));if(turning)return;if(n===i&&shown)return;
  const from=i;i=n;
  if(TURN!=='roll'||dir===undefined||!shown){paint(i);centre(i);shown=true;settle();return}
  // From a centred cover the book slides to the spine first, so the leaf turns from where the page is.
  turning=true;const go=()=>turn(from,n,dir>0,()=>{turning=false});const c=cache[n];const slide=book.style.transform!=='';book.style.transform='';const after=()=>{if(c&&!c.complete){c.onload=go;c.onerror=go}else go()};if(slide)setTimeout(after,240);else after();settle()}
prev.onclick=()=>show(i-1,-1);next.onclick=()=>show(i+1,1);document.querySelector('.tap.l').onclick=()=>show(i-1,-1);document.querySelector('.tap.r').onclick=()=>show(i+1,1);
document.addEventListener('keydown',(e)=>{if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();show(i+1,1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();show(i-1,-1)}if(e.key==='Home')show(0,-1);if(e.key==='End')show(P.length-1,1)});
let x0=null;document.addEventListener('touchstart',(e)=>{x0=e.touches[0].clientX},{passive:true});document.addEventListener('touchend',(e)=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(dx<-40)show(i+1,1);else if(dx>40)show(i-1,-1)});
document.addEventListener('keydown',(e)=>{if(e.key==='Escape'&&parent!==window)parent.postMessage('close-reader','*')});
addEventListener('resize',layout);layout();show(i);
</script></body></html>
